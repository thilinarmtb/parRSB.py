[build-system]
requires = ["scikit-build-core", "cython", "cython-cmake", "numpy", "mpi4py"]
build-backend = "scikit_build_core.build"

[project]
version = "0.0.1"
name = "parrsb"
description = ""
license = "MIT"
readme = "README.md"
authors = [
    { name = "Thilina Ratnayaka", email = "thilinarmtb@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
    "mpi4py>=4.1.1",
    "numpy>=2.2.6",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "cython-lint",
  "isort>=8",
  "ruff>=0.13.2",
]

[tool.cython-lint]
max-line-length = 88

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
preview = true
line-length = 80

[tool.ruff.lint]
extend-select = [
    "B",   # flake8-bugbear
    "C",   # flake8-comprehensions
    "E",   # pycodestyle
    "F",   # pyflakes

    "I",   # flake8-isort

    "N",   # pep8-naming
    "Q",   # flake8-quotes
    "W",   # pycodestyle

    "UP",  # pyupgrade
    "RUF",  # ruff
]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"
multiline-quotes = "double"

[tool.ruff.lint.isort]
combine-as-imports = true
